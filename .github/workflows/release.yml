name: Release

# Triggered manually. Every run increments the patch version, commits it,
# tags the release, builds all apps, and publishes binaries.
#
# Usage: GitHub → Actions → Release → Run workflow
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: smpl-apps-release
  cancel-in-progress: false

jobs:
  bump-and-release:
    name: Bump version, build, release
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged

    steps:
      - name: Require main branch
        run: |
          test "$GITHUB_REF" = refs/heads/main || {
            echo "::error::Release must be dispatched from main"
            exit 1
          }

      - name: Install git
        run: pacman -Sy --noconfirm --needed git

      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        run: |
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          echo "RELEASE_SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Bump patch version in workspace Cargo.toml
        id: version
        run: |
          CURRENT=$(grep -m1 '^version\s*=' Cargo.toml | grep -oP '\d+\.\d+\.\d+')
          MAJOR=$(echo "$CURRENT" | cut -d. -f1)
          MINOR=$(echo "$CURRENT" | cut -d. -f2)
          PATCH=$(echo "$CURRENT" | cut -d. -f3)
          NEW_PATCH=$((PATCH + 1))
          NEW_VERSION="${MAJOR}.${MINOR}.${NEW_PATCH}"
          sed -i "0,/^version\s*=\s*\"${CURRENT}\"/s//version    = \"${NEW_VERSION}\"/" Cargo.toml
          sed -i "s/Current workspace version: v${CURRENT}/Current workspace version: v${NEW_VERSION}/" README.md
          sed -i "s/^VERSION=${CURRENT}$/VERSION=${NEW_VERSION}/" README.md
          echo "old=$CURRENT"     >> "$GITHUB_OUTPUT"
          echo "new=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Bumped $CURRENT -> $NEW_VERSION"

      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel rust cargo mold \
            fontconfig freetype2 \
            libxkbcommon wayland wayland-protocols \
            pixman libglvnd mesa \
            gtk4 gtk4-layer-shell libadwaita \
            glib2 gobject-introspection \
            dbus python github-cli

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Test release packaging
        run: python -m unittest discover -s tests -p 'test_release_assets.py' -v

      - name: Build all apps (release)
        run: |
          export RUSTFLAGS="-C link-arg=-fuse-ld=mold"
          cargo build --release --workspace

      - name: Strip and collect binaries
        run: |
          python scripts/release_assets.py collect target/release dist
          ls -lh dist/

      - name: Bundle XR glasses module
        # The XR renderer lives in the public smpl-os/xr-workspace repo, so its
        # latest release tarball is fetched here with no token at all. If the
        # release can't be reached the smpl-apps build still succeeds without XR
        # rather than failing the whole build.
        env:
          XR_WORKSPACE_REPO: ${{ vars.XR_WORKSPACE_REPO || 'smpl-os/xr-workspace' }}
        run: |
          set -euo pipefail
          pacman -S --noconfirm --needed jq curl tar

          api="https://api.github.com/repos/${XR_WORKSPACE_REPO}/releases/latest"
          rel=$(curl -fsSL -H "Accept: application/vnd.github+json" "$api") || {
            echo "::warning::Could not reach ${XR_WORKSPACE_REPO} releases — skipping XR"
            exit 0
          }

          # Public release asset: download directly via browser_download_url.
          url=$(echo "$rel" | jq -r \
            '.assets[] | select(.name | test("xr-workspace-.*x86_64\\.tar\\.gz$")) | .browser_download_url' \
            | head -1)
          if [[ -z "$url" || "$url" == "null" ]]; then
            echo "::warning::No xr-workspace tarball asset found — skipping XR"
            exit 0
          fi

          xr_tag=$(echo "$rel" | jq -r '.tag_name')
          echo "Bundling xr-workspace ${xr_tag} into smpl-apps release"

          mkdir -p xr-tmp
          curl -fSL "$url" -o xr-tmp/xr.tar.gz
          tar -xzf xr-tmp/xr.tar.gz -C xr-tmp

          # Copy the four binaries (wherever they live in the tarball) into dist/
          # so the bundle tarball step picks them up automatically.
          for bin in xr-workspace xrctl xr-game xr-glasses-hotplugd; do
            src=$(find xr-tmp -type f -name "$bin" | head -1 || true)
            if [[ -n "$src" ]]; then
              strip "$src" 2>/dev/null || true
              cp "$src" dist/
            else
              echo "::warning::xr binary '$bin' not present in xr-workspace tarball"
            fi
          done
          echo "$xr_tag" > dist/.xr-version
          ls -lh dist/

      - name: Create bundle tarball
        run: |
          VERSION="${{ steps.version.outputs.new }}"
          tar -czf "smpl-apps-${VERSION}-x86_64.tar.gz" -C dist .
          echo "BUNDLE=smpl-apps-${VERSION}-x86_64.tar.gz" >> "$GITHUB_ENV"

      - name: Verify bundle matches mandatory standalone assets
        run: python scripts/release_assets.py verify dist "$BUNDLE"

      - name: Commit version bump and tag without changing built sources
        run: |
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$RELEASE_SOURCE_SHA" || {
            echo "::error::main advanced during the build; rerun the release on its latest source"
            exit 1
          }
          git add Cargo.toml Cargo.lock README.md
          git commit -m "chore: release v${{ steps.version.outputs.new }}" \
            -m "Co-authored-by: Copilot App <223556219+Copilot@users.noreply.github.com>"
          git tag "${{ steps.version.outputs.tag }}"
          git push --atomic origin HEAD:refs/heads/main "refs/tags/${{ steps.version.outputs.tag }}"

      - name: Upload draft GitHub Release
        id: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "smpl-apps v${{ steps.version.outputs.new }}"
          generate_release_notes: true
          draft: true
          fail_on_unmatched_files: true
          files: |
            ${{ env.BUNDLE }}
            dist/start-menu
            dist/notif-center
            dist/settings
            dist/app-center
            dist/webapp-center
            dist/sync-center-daemon
            dist/sync-center-gui
            dist/smpl-calendar
            dist/smpl-calendar-alertd
            dist/smpl-hints
            dist/smpl-hintsd
            dist/smpl-calendar-alertd.service

      - name: Verify uploads before publishing latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.release.outputs.id }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" > uploaded-release.json
          python scripts/release_assets.py uploaded dist "$BUNDLE" uploaded-release.json
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            -F draft=false -f make_latest=true --jq .html_url
