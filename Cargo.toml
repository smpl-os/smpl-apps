[workspace]
members = [
    "smpl-common",
    "start-menu",
    "notif-center",
    "settings",
    "app-center",
    "webapp-center",
    "sync-center",
    "calendar",
    "hints",
]
resolver = "2"

[workspace.package]
version    = "0.8.21"
edition    = "2021"
authors    = ["smplOS <https://github.com/smpl-os>"]
license    = "MIT"
repository = "https://github.com/smpl-os/smpl-apps"

# ── Shared dependency versions ───────────────────────────────────────────────
# Bump here to update all apps at once.
[workspace.dependencies]
# UI
slint                 = { version = "1.8", default-features = false, features = ["backend-winit", "renderer-femtovg", "compat-1-2"] }
i-slint-backend-winit = "1.8"
slint-build           = "1.8"
smpl-common           = { path = "smpl-common" }

# Serialization
serde      = { version = "1", features = ["derive"] }
serde_json = "1"

# HTTP / URL
ureq = { version = "2", features = ["json"] }
url  = "2"

# Date/time
chrono = { version = "0.4", default-features = false, features = ["clock"] }

# System
xkbcommon = "0.9"
libc      = "0.2"
dirs      = "6"
nix       = { version = "0.27", features = ["fs"] }

# Wi-Fi / QR / Security
qrcode  = "0.14"
zeroize = { version = "1", features = ["derive"] }
rfd       = "0.15"

# GTK / GLib (sync-center volume monitoring)
glib = "0.20"
gio  = { version = "0.20", features = ["v2_70"] }

# D-Bus (sync-center)
zbus     = { version = "3.0", features = ["tokio"] }
zvariant = "3.0"

# Async (sync-center)
tokio   = { version = "1", features = ["full"] }
futures = "0.3"

# Logging (sync-center)
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Notifications / errors (sync-center)
notify-rust = "4.10"
uuid        = { version = "1.0", features = ["serde", "v4"] }
anyhow      = "1.0"
thiserror   = "1.0"

# Fuzzy matching (start-menu)
nucleo-matcher = "0.3"

# ── hints crate ──────────────────────────────────────────────────────────────
# AT-SPI2 client for enumerating accessible widgets.
atspi                 = { version = "0.30", default-features = false, features = ["proxies", "connection", "tokio"] }
# Wayland client + wlr virtual-pointer for injecting synthetic clicks/scrolls
# under Hyprland (and any other wlroots compositor).
wayland-client        = "0.31"
wayland-protocols     = { version = "0.32", features = ["client"] }
wayland-protocols-wlr = { version = "0.3",  features = ["client"] }
# xkbcommon keysym → wl_pointer motion; already declared above but kept here
# as a note that hints depends on it.
# Async runtime is inherited via `tokio` above.

# ── Release profile (applied to all apps) ────────────────────────────────────
[profile.release]
opt-level     = 3       # maximum speed (default, but explicit)
lto           = true    # cross-crate inlining
codegen-units = 1       # single CGU for better whole-program optimisation
strip         = true    # strip debug symbols → smaller binary, faster mmap
panic         = "abort" # no unwinding tables → smaller binary, faster cold load
