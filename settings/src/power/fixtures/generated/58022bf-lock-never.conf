# smplOS Hypridle Configuration
# Managed by Settings app -- manual edits will be overwritten

general {
    lock_cmd = pidof hyprlock || hyprlock
    after_sleep_cmd = hyprctl dispatch "hl.dsp.dpms({state='on'})"; sleep 0.2; hyprctl reload; sleep 0.2; hyprctl dispatch "hl.dsp.dpms({state='on'})"
}


# 6 min -- screen off
listener {
    timeout = 330
    on-timeout = systemd-detect-virt -q || hyprctl dispatch "hl.dsp.dpms({state='off'})"
    on-resume = hyprctl dispatch "hl.dsp.dpms({state='on'})"; sleep 0.2; hyprctl reload; sleep 0.2; hyprctl dispatch "hl.dsp.dpms({state='on'})"
    ignore_inhibit = true
}

# 10 min -- suspend
listener {
    timeout = 600
    on-timeout = systemd-detect-virt -q || systemctl suspend
    ignore_inhibit = true
}

