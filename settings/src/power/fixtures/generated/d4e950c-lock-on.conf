# smplOS Hypridle Configuration
# Managed by Settings app -- manual edits will be overwritten

general {
    lock_cmd = pidof hyprlock || lock-screen
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = loginctl lock-session; sleep 0.5; hyprctl dispatch "hl.dsp.dpms({state='on'})"
}

# 5 min -- lock screen
listener {
    timeout = 300
    on-timeout = loginctl lock-session
    ignore_inhibit = true
}

# 6 min -- screen off
listener {
    timeout = 330
    on-timeout = systemd-detect-virt -q || hyprctl dispatch "hl.dsp.dpms({state='off'})"
    ignore_inhibit = true
}

# 10 min -- suspend
listener {
    timeout = 600
    on-timeout = systemd-detect-virt -q || systemctl suspend
    ignore_inhibit = true
}

